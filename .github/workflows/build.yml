name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14.8'

    - name: Generate version file
      shell: python
      run: |
        import os
        os.makedirs("src/core", exist_ok=True)
        tag = os.environ.get("GITHUB_REF_NAME", "v0.0.0-dev")
        with open("src/core/version.py", "w", encoding="utf-8") as f:
            f.write(f'INTERNAL_TAG = "{tag}"\n')
        print(f"Generated src/core/version.py with tag: {tag}")

    - name: Build with PyInstaller (Windows/macOS)
      if: matrix.os != 'ubuntu-latest'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
        pyinstaller --clean --onedir --windowed --paths src --name PulsarLauncher src/main.py

    - name: Build with PyInstaller (Linux - Docker)
      if: matrix.os == 'ubuntu-latest'
      run: |
        docker run --rm --pull always -v ${{ github.workspace }}:/src python:3.14.8-slim bash -c "
          cd /src &&
          apt-get update && apt-get install -y git binutils &&
          pip install --upgrade pip &&
          pip install -r requirements.txt &&
          pip install pyinstaller &&
          pyinstaller --clean --onefile --windowed --paths src --name PulsarLauncher src/main.py &&
          mv dist/PulsarLauncher dist/PulsarLauncher-${{ github.ref_name }}-linux
        "

    - name: Package artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path dist/PulsarLauncher\* -DestinationPath dist/PulsarLauncher-${{ github.ref_name }}-windows.zip

    - name: Package artifact (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        cd dist
        zip -r PulsarLauncher-${{ github.ref_name }}-macos.app.zip PulsarLauncher.app

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: executable-${{ matrix.os }}
        path: |
          dist/PulsarLauncher-${{ github.ref_name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/PulsarLauncher-${{ github.ref_name }}*
        draft: true